name: Release Windows Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x86, win-x64]
        selfContained: [true, false]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine variables
        id: vars
        shell: bash
        run: |
          if [ "${{ matrix.selfContained }}" = "true" ]; then
            echo "suffix=self-contained" >> "$GITHUB_OUTPUT"
            echo "compress=-p:EnableCompressionInSingleFile=true" >> "$GITHUB_OUTPUT"
          else
            echo "suffix=framework-dependent" >> "$GITHUB_OUTPUT"
            echo "compress=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: >
          dotnet publish "Health-Assistant/Health-Assistant.csproj"
          -c Release
          -r ${{ matrix.rid }}
          --self-contained ${{ matrix.selfContained }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          ${{ steps.vars.outputs.compress }}
          -o publish

      - name: Zip artifact
        shell: bash
        run: |
          ARTIFACT="Health-Assistant_${GITHUB_REF_NAME}_${{ matrix.rid }}_${{ steps.vars.outputs.suffix }}.zip"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
          7z a -tzip "$ARTIFACT" ./publish/*
          echo "Created $ARTIFACT"
          ls -lh "$ARTIFACT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          generate_release_notes: true
